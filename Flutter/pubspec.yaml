name: assetbox_mobile
description: AssetBox mobile — AI Game Asset Marketplace (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  supabase_flutter: ^2.9.0
  app_links: ^6.4.0
  image_picker: ^1.1.2
  mime: ^2.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo-icon.png
  adaptive_icon_background: "#0a0e1a"
  adaptive_icon_foreground: assets/images/logo-icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo-icon.png
    - assets/images/site-background.png
    - assets/images/auth-hero.png
    - assets/images/google-g.svg
